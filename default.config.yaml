# yaml-language-server: $schema=./.kokimoki/schema.json

# Theme variables for DaisyUI
theme:
  colorBase100: 'oklch(100% 0 0)'
  colorBase200: 'oklch(97% 0 0)'
  colorBase300: 'oklch(92% 0 0)'
  colorBaseContent: 'oklch(20% 0 0)'
  colorPrimary: 'oklch(85% 0.199 91.936)'
  colorPrimaryContent: 'oklch(42% 0.095 57.708)'
  colorSecondary: 'oklch(75% 0.183 55.934)'
  colorSecondaryContent: 'oklch(40% 0.123 38.172)'
  colorAccent: 'oklch(0% 0 0)'
  colorAccentContent: 'oklch(100% 0 0)'
  colorNeutral: 'oklch(37% 0.01 67.558)'
  colorNeutralContent: 'oklch(92% 0.003 48.717)'
  colorInfo: 'oklch(74% 0.16 232.661)'
  colorInfoContent: 'oklch(39% 0.09 240.876)'
  colorSuccess: 'oklch(76% 0.177 163.223)'
  colorSuccessContent: 'oklch(37% 0.077 168.94)'
  colorWarning: 'oklch(82% 0.189 84.429)'
  colorWarningContent: 'oklch(41% 0.112 45.904)'
  colorError: 'oklch(70% 0.191 22.216)'
  colorErrorContent: 'oklch(39% 0.141 25.723)'
  radiusSelector: '1rem'
  radiusField: '0.5rem'
  radiusBox: '1rem'
  sizeSelector: '0.25rem'
  sizeField: '0.25rem'
  border: '1px'
  noise: '0'
  depth: '1'

# Translations
title: 'Quiz Royale'

gameLobbyMd: |
  # Get ready for Quiz Royale!
  Answer questions correctly to stay in the game. Last player standing wins!

connectionsMd: |
  # Players Connected

questionMd: |
  # Question

eliminatedMd: |
  # You have been eliminated!
  Better luck next time!

winnerMd: |
  # Congratulations!
  You are the Quiz Royale Champion!

waitingForNextQuestionMd: |
  # Next question coming up...

players: 'Players'
playersRemaining: 'Players Remaining'
eliminated: 'Eliminated'
question: 'Question'
timeElapsed: 'Time elapsed'
timeRemaining: 'Time remaining'
startButton: 'Start Quiz Royale'
stopButton: 'Stop Game'
nextQuestionButton: 'Next Question'
loading: 'Loading...'
generateQuestionLoading: 'Generating question...'

menuTitle: 'Menu'
menuConnections: 'Players'
menuGameLobby: 'Lobby'

playerNameTitle: 'Enter Your Name'
playerNamePlaceholder: 'Your name...'
playerNameLabel: 'Name:'
playerNameButton: 'Join Quiz Royale'

hostLabel: 'Quiz Master'
presenterLabel: 'Quiz Royale'

gameLinksTitle: 'Quiz Royale Links'
playerLinkLabel: 'Player Link'
presenterLinkLabel: 'Presenter Display'

menuAriaLabel: 'Open menu drawer'

# Quiz specific
answerA: 'A'
answerB: 'B'
answerC: 'C'
answerD: 'D'
selectAnswer: 'Select your answer'
correctAnswer: 'Correct Answer'
yourAnswer: 'Your Answer'
finalScore: 'Final Score'
winner: 'Winner'
champion: 'Quiz Royale Champion'

# Timing (in milliseconds)
questionTimeLimit: 10000 # 10 seconds
answerRevealTime: 3000 # 3 seconds
questionTransitionTime: 1000 # 1 second - faster transitions

# Audio settings
enableAudio: true
correctAnswerSoundUrl: '' # URL to correct answer sound
eliminationSoundUrl: '' # URL to elimination sound

# AI Configuration
aiSystemPrompt: 'You are a trivia question generator. Create engaging multiple-choice questions with exactly 4 options (A, B, C, D). Always vary the topic and category for each question. Return only valid JSON in this exact format: {"question": "Question text here?", "options": {"A": "Option A", "B": "Option B", "C": "Option C", "D": "Option D"}, "correctAnswer": "A"}'
aiUserPromptTemplate: 'Generate a unique trivia question with difficulty level {difficulty}. Difficulty guidelines: 1=very basic common knowledge (colors, simple animals), 2=easy everyday facts, 3=school-level knowledge, 4=general education, 5=requires some expertise, 6=challenging specialized knowledge, 7=very difficult expert level, 8+=extremely obscure. Pick a random category from: general knowledge, science, history, sports, entertainment, geography, literature, movies, music, nature, technology, food, art. Ensure the question matches the difficulty level appropriately. Make it appropriate for all ages and avoid repetitive topics.'
